[env:seeed_xiao_esp32s3]
platform = espressif32@^6.5.0
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -mlongcalls, -DCORE_DEBUG_LEVEL=0
lib_deps = 
	esphome/ESP32-audioI2S@^2.3.0
	hideakitai/PCA95x5@^0.1.3
   
